[package]
name = "cobblify-encode"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "cobblify-encode"
path = "src/main.rs"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media", "objc2-core-video"] }
objc2-avf-audio = "0.3"
objc2-core-audio-types = "0.3"
objc2-core-foundation = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_UI_Shell"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
