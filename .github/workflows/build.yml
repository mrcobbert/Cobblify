# Builds the mod on every push/PR, and on a version tag (v*) publishes a GitHub Release
# with the correct production jar attached (the remapped, NON -dev jar).
# Two separate Gradle builds run in parallel: the Forge one at the repo root, and the
# Weave/Lunar one rooted at `lunar/` (its own wrapper, own settings, own toolchain).

name: Build & Release

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]

concurrency:
  group: ${{ github.head_ref || format('{0}-{1}', github.ref, github.run_number) }}
  cancel-in-progress: true

permissions:
  contents: write   # needed to create releases on tag push

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Fails when the Forge and Lunar trees diverge in a way tools/tree-divergence.txt
      # does not declare. It runs in this job, not the Lunar one, because this job
      # publishes the Release on a tag and the two jobs are independent - a detector
      # over there could fail only after the release had already been created.
      # Needs no JDK, so running it first costs nothing.
      - name: Check tree drift
        run: ./tools/check-tree-drift.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Cache Gradle / Loom
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            **/loom-cache
            **/prebundled-jars
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Chmod Gradle
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      # The production jar is the remapped, non-dev one. The shadowJar (-dev) must NOT be shipped:
      # it uses dev mappings and crashes an obfuscated Forge runtime.
      - name: Collect release jar
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p release
          find versions -path '*/build/libs/*.jar' ! -name '*-dev.jar' ! -name '*-sources.jar' \
            -exec cp {} release/ \;
          echo "Release artifacts:"; ls -la release/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BedwarsQOL-jar
          path: |
            versions/**/build/libs/*.jar
            !versions/**/build/libs/*-dev.jar

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.jar
          generate_release_notes: true
          fail_on_unmatched_files: true

  lunar:
    name: Build (Lunar)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Gradle 9.4 itself needs JDK 17+ to run, but lunar/build.gradle.kts pins a Java 8
      # toolchain for the mod classes, so both JDKs have to be on the machine.
      - name: Set up JDK 21 and the JDK 8 toolchain
        uses: actions/setup-java@v4
        with:
          java-version: |
            8
            21
          distribution: temurin

      - name: Cache Gradle / Weave
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-lunar-${{ hashFiles('lunar/**/*.gradle*', 'lunar/gradle.properties', 'lunar/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-lunar-

      - name: Chmod Gradle
        run: chmod +x ./lunar/gradlew

      # fromEnv points the Java 8 toolchain at the JDK setup-java installed, so Gradle never
      # has to auto-provision one. Do NOT add --configuration-cache here: lunar/gradle.properties
      # disables it on purpose (Weave 1.3.3 configures Minecraft deps in afterEvaluate and the
      # cache silently drops the mapped-Minecraft dependency).
      - name: Build
        working-directory: lunar
        run: ./gradlew build --no-daemon -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BedwarsQOL-Lunar-jar
          path: lunar/build/libs/*.jar
