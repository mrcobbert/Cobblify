# Builds the mod on every push/PR, and on a version tag (v*) publishes a GitHub Release
# with the correct production jar attached (the remapped, NON -dev jar).
# Two separate Gradle builds run in parallel: the Forge one at the repo root, and the
# Weave/Lunar one rooted at `lunar/` (its own wrapper, own settings, own toolchain).

name: Build & Release

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]

concurrency:
  group: ${{ github.head_ref || format('{0}-{1}', github.ref, github.run_number) }}
  cancel-in-progress: true

permissions:
  contents: write   # needed to create releases on tag push

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Fails when the Forge and Lunar trees diverge in a way tools/tree-divergence.txt
      # does not declare. It runs in this job, not the Lunar one, because this job
      # publishes the Release on a tag and the two jobs are independent - a detector
      # over there could fail only after the release had already been created.
      # Needs no JDK, so running it first costs nothing.
      - name: Check tree drift
        run: ./tools/check-tree-drift.sh

      # Tests the checker itself. A drift check that passes when it should fail
      # manufactures confidence, so its claimed behaviours are asserted rather
      # than assumed. Runs entirely in throwaway clones; needs no JDK.
      - name: Self-test the drift checker
        run: ./tools/test-tree-drift.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Cache Gradle / Loom
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            **/loom-cache
            **/prebundled-jars
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Chmod Gradle
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      # The production jar is the remapped, non-dev one. The shadowJar (-dev) must NOT be shipped:
      # it uses dev mappings and crashes an obfuscated Forge runtime.
      - name: Collect release jar
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p release
          find versions -path '*/build/libs/*.jar' ! -name '*-dev.jar' ! -name '*-sources.jar' \
            -exec cp {} release/ \;
          echo "Release artifacts:"; ls -la release/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BedwarsQOL-jar
          path: |
            versions/**/build/libs/*.jar
            !versions/**/build/libs/*-dev.jar

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.jar
          generate_release_notes: true
          fail_on_unmatched_files: true

  lunar:
    name: Build (Lunar)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Gradle 9.4 itself needs JDK 17+ to run, but lunar/build.gradle.kts pins a Java 8
      # toolchain for the mod classes, so both JDKs have to be on the machine.
      - name: Set up JDK 21 and the JDK 8 toolchain
        uses: actions/setup-java@v4
        with:
          java-version: |
            8
            21
          distribution: temurin

      - name: Cache Gradle / Weave
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-lunar-${{ hashFiles('lunar/**/*.gradle*', 'lunar/gradle.properties', 'lunar/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-lunar-

      - name: Chmod Gradle
        run: chmod +x ./lunar/gradlew

      # fromEnv points the Java 8 toolchain at the JDK setup-java installed, so Gradle never
      # has to auto-provision one. Do NOT add --configuration-cache here: lunar/gradle.properties
      # disables it on purpose (Weave 1.3.3 configures Minecraft deps in afterEvaluate and the
      # cache silently drops the mapped-Minecraft dependency).
      - name: Build
        working-directory: lunar
        run: ./gradlew build --no-daemon -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BedwarsQOL-Lunar-jar
          path: lunar/build/libs/*.jar

  # Builds and tests the Cobblify launcher on real Windows - the automated
  # substitute for having no Windows machine (Windows-port PLAN Phase 5). The
  # exe it uploads is naked: the owner zip is assembled locally with the
  # secret-bearing jars, never in CI, so this job needs no secrets at all.
  launcher-windows:
    name: Launcher (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    # The workflow-level write grant exists for release publishing; this job
    # runs npm lifecycle scripts and must not inherit it.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      # The privacy contract, enforced mechanically: proc.rs is the only file
      # in the crate allowed to touch sysinfo (the game JVM's argv carries a
      # live Minecraft access token; see launcher/src-tauri/src/proc.rs).
      # Exact full-path allowlist: a nested proc.rs or a notproc.rs must NOT
      # slip through a suffix match.
      - name: Enforce the sysinfo containment boundary
        shell: bash
        run: |
          hits=$(grep -rl sysinfo launcher/src-tauri/src --include='*.rs' | grep -vx 'launcher/src-tauri/src/proc.rs' || true)
          if [ -n "$hits" ]; then
            echo "sysinfo reached outside launcher/src-tauri/src/proc.rs:"; echo "$hits"; exit 1
          fi
          # A dependency alias (`somename = { package = "sysinfo" }`) would let
          # code import sysinfo without the literal text. Ask Cargo itself
          # rather than pattern-matching TOML (quote styles and escape
          # sequences make regexes evadable): any dependency whose real
          # package is sysinfo under a different name fails.
          aliased=$(cargo metadata --no-deps --format-version 1 \
              --manifest-path launcher/src-tauri/Cargo.toml \
            | jq -r '.packages[].dependencies[] | select(.name == "sysinfo" and .rename != null) | .rename')
          if [ -n "$aliased" ]; then
            echo "sysinfo must not be aliased in Cargo.toml (found: $aliased)"; exit 1
          fi

      - name: Update Rust
        run: rustup update --no-self-update stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            launcher/src-tauri/target
          key: ${{ runner.os }}-launcher-cargo-${{ hashFiles('launcher/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-launcher-cargo-

      - name: npm ci
        working-directory: launcher
        run: npm ci

      # The Windows automated gate: the whole suite on real Windows, including
      # the argv-canary privacy test and the cfg(windows) semantics tests.
      - name: cargo test
        run: cargo test --manifest-path launcher/src-tauri/Cargo.toml

      # Naked exe only - the bundler never runs on Windows (portable zip
      # packaging happens owner-side).
      - name: Build the launcher exe
        working-directory: launcher
        run: npx tauri build --no-bundle

      - name: Upload the exe
        uses: actions/upload-artifact@v4
        with:
          name: Cobblify-Launcher-Windows
          path: launcher/src-tauri/target/release/*.exe
          retention-days: 7
