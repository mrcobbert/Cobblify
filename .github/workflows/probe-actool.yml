name: Probe actool (temporary, never merged)
on:
  push:
    branches: [probe/actool]
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: tauri build with a logging actool
        working-directory: launcher
        run: |
          xcode26=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          mkdir -p "$RUNNER_TEMP/xcode26-bin"
          cat > "$RUNNER_TEMP/xcode26-bin/actool" <<WRAP
          #!/bin/sh
          log="$RUNNER_TEMP/actool.log"
          {
            echo "=== actool \$*"
            echo "cwd: \$(pwd)"
            env | sort | grep -v -i "token\|key\|secret"
            for a in "\$@"; do case "\$a" in *.icon) echo "input:"; find "\$a" -exec ls -ld {} \; ; cat "\$a/icon.json";; esac; done
          } >> "\$log" 2>&1
          DEVELOPER_DIR="$xcode26/Contents/Developer" /usr/bin/xcrun actool "\$@" > "\$log.out" 2>&1
          rc=\$?
          grep -v '^dyld' "\$log.out" | tee -a "\$log"
          echo "rc=\$rc" >> "\$log"
          for a in "\$@"; do case "\$a" in */out) echo "out dir:"; ls -la "\$a";; esac; done >> "\$log" 2>&1
          exit \$rc
          WRAP
          chmod +x "$RUNNER_TEMP/xcode26-bin/actool"
          export PATH="$RUNNER_TEMP/xcode26-bin:$PATH"
          npm ci
          npx tauri build --bundles app --ci || echo "tauri build failed: $?"
          cat "$RUNNER_TEMP/actool.log"
