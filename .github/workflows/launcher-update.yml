name: Launcher Update Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact repo version to build
        required: true

permissions:
  contents: read

concurrency:
  group: launcher-update-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  macos:
    # Java 8 is unavailable on GitHub's ARM macOS image. The Intel image can
    # install it and still cross-compile the universal Apple bundle.
    runs-on: macos-15-intel
    environment: launcher-stable
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            21
      - name: Verify version
        env: { RELEASE_VERSION: "${{ inputs.version }}" }
        run: |
          ./tools/check-release-version.sh
          test "$(sed -n 's/^mod_version=//p' gradle.properties)" = "$RELEASE_VERSION"
      - name: Build private mod resources
        env:
          BACKEND_URL: ${{ secrets.COBBLIFY_BACKEND_URL }}
          BACKEND_TOKEN: ${{ secrets.COBBLIFY_BACKEND_TOKEN }}
          WEAVE_AGENT_PASSPHRASE: ${{ secrets.WEAVE_AGENT_PASSPHRASE }}
          WEAVE_AGENT_SHA256: e63da5ed3cc85868088527cd7d49ebd708785b6567da389fe89a89913ef4afd2
        run: |
          mkdir -p "$RUNNER_TEMP/gradle-home"
          printf 'cobblifyBackendUrl=%s\ncobblifyBackendToken=%s\n' "$BACKEND_URL" "$BACKEND_TOKEN" > "$RUNNER_TEMP/gradle-home/gradle.properties"
          GRADLE_USER_HOME="$RUNNER_TEMP/gradle-home" ./gradlew :1.8.9-forge:assemble --no-daemon
          (cd lunar && GRADLE_USER_HOME="$RUNNER_TEMP/gradle-home" ./gradlew assemble --no-daemon -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64)
          test -n "$WEAVE_AGENT_PASSPHRASE"
          node launcher/tools/weave-agent-crypto.mjs decrypt \
            launcher/vendor/Weave-Loader-Agent-1.3.3.jar.enc \
            "$RUNNER_TEMP/Weave-Loader-Agent-1.3.3.jar"
          node launcher/tools/verify-file-sha256.mjs "$RUNNER_TEMP/Weave-Loader-Agent-1.3.3.jar" "$WEAVE_AGENT_SHA256"
          node launcher/tools/stage-update-resources.mjs launcher/src-tauri/resources \
            "lunar/build/libs/Cobblify-Lunar-${{ inputs.version }}.jar" \
            "$RUNNER_TEMP/Weave-Loader-Agent-1.3.3.jar" \
            "versions/1.8.9-forge/build/libs/Cobblify-1.8.9-forge-${{ inputs.version }}.jar" \
            "${{ inputs.version }}"
      - name: Build universal signed updater artifact
        working-directory: launcher
        env:
          COBBLIFY_UPDATE_URL: ${{ secrets.COBBLIFY_UPDATE_URL }}
          COBBLIFY_UPDATE_TOKEN: ${{ secrets.COBBLIFY_BACKEND_TOKEN }}
          COBBLIFY_UPDATER_PUBKEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci
          npm test
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          npx tauri build --target universal-apple-darwin --bundles app --ci \
            --config '{"bundle":{"createUpdaterArtifacts":true}}'
          bundle_dir="src-tauri/target/universal-apple-darwin/release/bundle/macos"
          app_count=$(find "$bundle_dir" -maxdepth 1 -name '*.app' -type d | wc -l | tr -d '[:space:]')
          test "$app_count" = 1
          app=$(find "$bundle_dir" -maxdepth 1 -name '*.app' -type d -print -quit)
          codesign --verify --deep --strict "$app"
          install_dir="$RUNNER_TEMP/Cobblify-Mac-${{ inputs.version }}"
          mkdir "$install_dir"
          cp -R "$app" "$install_dir/"
          cp "friend/MAC INSTALL.txt" "$install_dir/"
          install_zip="$bundle_dir/Cobblify-Launcher-macos-universal.zip"
          ditto -c -k --sequesterRsrc "$install_dir" "$install_zip"
          verify_dir="$RUNNER_TEMP/verify-mac-zip"
          mkdir "$verify_dir"
          ditto -x -k "$install_zip" "$verify_dir"
          codesign --verify --deep --strict "$verify_dir/$(basename "$app")"
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-update-macos-${{ inputs.version }}
          path: |
            launcher/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            launcher/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
            launcher/src-tauri/target/universal-apple-darwin/release/bundle/macos/Cobblify-Launcher-macos-universal.zip
          retention-days: 30
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    environment: launcher-stable
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            21
      - name: Verify version
        shell: bash
        env: { RELEASE_VERSION: "${{ inputs.version }}" }
        run: |
          ./tools/check-release-version.sh
          test "$(sed -n 's/^mod_version=//p' gradle.properties)" = "$RELEASE_VERSION"
      - name: Build private mod resources
        shell: bash
        env:
          BACKEND_URL: ${{ secrets.COBBLIFY_BACKEND_URL }}
          BACKEND_TOKEN: ${{ secrets.COBBLIFY_BACKEND_TOKEN }}
          WEAVE_AGENT_PASSPHRASE: ${{ secrets.WEAVE_AGENT_PASSPHRASE }}
          WEAVE_AGENT_SHA256: e63da5ed3cc85868088527cd7d49ebd708785b6567da389fe89a89913ef4afd2
        run: |
          mkdir -p "$RUNNER_TEMP/gradle-home"
          printf 'cobblifyBackendUrl=%s\ncobblifyBackendToken=%s\n' "$BACKEND_URL" "$BACKEND_TOKEN" > "$RUNNER_TEMP/gradle-home/gradle.properties"
          GRADLE_USER_HOME="$RUNNER_TEMP/gradle-home" ./gradlew.bat :1.8.9-forge:assemble --no-daemon
          (cd lunar && GRADLE_USER_HOME="$RUNNER_TEMP/gradle-home" ./gradlew.bat assemble --no-daemon -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64)
          test -n "$WEAVE_AGENT_PASSPHRASE"
          node launcher/tools/weave-agent-crypto.mjs decrypt \
            launcher/vendor/Weave-Loader-Agent-1.3.3.jar.enc \
            "$RUNNER_TEMP/Weave-Loader-Agent-1.3.3.jar"
          node launcher/tools/verify-file-sha256.mjs "$RUNNER_TEMP/Weave-Loader-Agent-1.3.3.jar" "$WEAVE_AGENT_SHA256"
          node launcher/tools/stage-update-resources.mjs launcher/src-tauri/resources \
            "lunar/build/libs/Cobblify-Lunar-${{ inputs.version }}.jar" \
            "$RUNNER_TEMP/Weave-Loader-Agent-1.3.3.jar" \
            "versions/1.8.9-forge/build/libs/Cobblify-1.8.9-forge-${{ inputs.version }}.jar" \
            "${{ inputs.version }}"
      - name: Build NSIS signed updater artifact
        shell: bash
        working-directory: launcher
        env:
          COBBLIFY_UPDATE_URL: ${{ secrets.COBBLIFY_UPDATE_URL }}
          COBBLIFY_UPDATE_TOKEN: ${{ secrets.COBBLIFY_BACKEND_TOKEN }}
          COBBLIFY_UPDATER_PUBKEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci
          npm test
          npx tauri build --bundles nsis --ci \
            --config '{"bundle":{"createUpdaterArtifacts":true}}'
          bundle_dir="src-tauri/target/release/bundle/nsis"
          test "$(find "$bundle_dir" -maxdepth 1 -name '*-setup.exe' -type f | wc -l | tr -d '[:space:]')" = 1
          test "$(find "$bundle_dir" -maxdepth 1 -name '*-setup.exe.sig' -type f | wc -l | tr -d '[:space:]')" = 1
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-update-windows-${{ inputs.version }}
          path: |
            launcher/src-tauri/target/release/bundle/nsis/*-setup.exe
            launcher/src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          retention-days: 30
          if-no-files-found: error

  ready:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Record candidate identity
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          mkdir candidate-metadata
          jq -n \
            --arg version "$RELEASE_VERSION" \
            --arg commit "$GITHUB_SHA" \
            --arg runId "$GITHUB_RUN_ID" \
            '{version: $version, commit: $commit, runId: $runId}' \
            > candidate-metadata/candidate.json
          {
            echo "## Candidate ready"
            echo
            echo "Test the Mac artifact from run \`$GITHUB_RUN_ID\`."
            echo "If it passes, run **Promote Launcher Update** with candidate run ID \`$GITHUB_RUN_ID\`."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-update-metadata-${{ inputs.version }}
          path: candidate-metadata/candidate.json
          retention-days: 30
          if-no-files-found: error
