name: Launcher Update Candidate
run-name: Launcher ${{ inputs.version }}${{ inputs.local_build && format(' local {0}', inputs.local_id) || '' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact repo version to build
        required: true
      local_build:
        description: Build on the owner's on-demand Mac and Windows runners (start with tools/local-ci/run-release.py)
        type: boolean
        default: false
      local_id:
        description: Controller-generated random label; required only for local builds
        default: ''
      publish_dev:
        description: Also publish this build to the opt-in dev channel as <version>-dev.<run number>
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: launcher-update-${{ inputs.version }}
  cancel-in-progress: false

# A dev build carries a pre-release version so it sorts below the release it precedes;
# the pins in the repo (and every mod jar) stay at the plain version.
env:
  BUILD_VERSION: ${{ inputs.publish_dev && format('{0}-dev.{1}', inputs.version, github.run_number) || inputs.version }}

jobs:
  local-assets:
    if: ${{ inputs.local_build }}
    runs-on: macos-15-intel
    steps:
      - name: Authorize local release
        env:
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          LOCAL_ID: ${{ inputs.local_id }}
        run: |
          test "$ACTOR" = mrcobbert
          test "$REPOSITORY" = mrcobbert/Cobblify
          [[ "$LOCAL_ID" =~ ^[a-f0-9]{32}$ ]]
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Compile the current Mac icon with Xcode
        run: |
          xcode26=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          test -n "$xcode26"
          export DEVELOPER_DIR="$xcode26/Contents/Developer"
          mkdir -p "$RUNNER_TEMP/icon-source" macos-icon
          cp -R launcher/src-tauri/icons/Cobblify.icon "$RUNNER_TEMP/icon-source/Icon.icon"
          xcrun actool "$RUNNER_TEMP/icon-source/Icon.icon" --compile macos-icon \
            --output-format human-readable-text --notices --warnings \
            --output-partial-info-plist macos-icon/assetcatalog_generated_info.plist \
            --app-icon Icon --include-all-app-icons --accent-color AccentColor \
            --enable-on-demand-resources NO --development-region en --target-device mac \
            --minimum-deployment-target 26.0 --platform macosx < /dev/null
          test -s macos-icon/Assets.car
          python3 tools/local-ci/icon-assets.py record launcher/src-tauri/icons/Cobblify.icon macos-icon
      - uses: actions/upload-artifact@v4
        with:
          name: local-macos-icon
          path: macos-icon/
          retention-days: 7
          if-no-files-found: error

  macos:
    needs: [local-assets]
    if: ${{ !cancelled() && (needs.local-assets.result == 'success' || (!inputs.local_build && needs.local-assets.result == 'skipped')) }}
    # Java 8 is unavailable on GitHub's ARM macOS image. The Intel image can
    # install it and still cross-compile the universal Apple bundle.
    runs-on: ${{ inputs.local_build && fromJSON(format('["cobblify-{0}-macos"]', inputs.local_id)) || 'macos-15-intel' }}
    timeout-minutes: 45
    concurrency:
      group: ${{ inputs.local_build && 'local-macos-build' || format('hosted-macos-{0}', github.run_id) }}
      cancel-in-progress: false
    environment: launcher-stable
    env:
      # Keep checkout bytes identical to the index without changing either user's git settings.
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Configure private local caches
        if: ${{ inputs.local_build }}
        shell: bash
        run: |
          test -n "$COBBLIFY_CI_CACHE"
          mkdir -p "$COBBLIFY_CI_CACHE/gradle" "$COBBLIFY_CI_CACHE/cargo"
          echo "GRADLE_USER_HOME=$COBBLIFY_CI_CACHE/gradle" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$COBBLIFY_CI_CACHE/cargo" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = macOS ]; then
            jdk21=$(/usr/libexec/java_home -v 21)
            jdk8=/Library/Java/JavaVirtualMachines/zulu-8.jdk/Contents/Home
            test -x "$jdk8/bin/java"
            echo "SDKROOT=/Library/Developer/CommandLineTools/SDKs/MacOSX26.5.sdk" >> "$GITHUB_ENV"
            echo "JAVA_HOME=$jdk21" >> "$GITHUB_ENV"
            echo "JAVA_HOME_8_X64=$jdk8" >> "$GITHUB_ENV"
            echo "$jdk21/bin" >> "$GITHUB_PATH"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - uses: actions/setup-java@v4
        if: ${{ !inputs.local_build || runner.os != 'macOS' }}
        with:
          distribution: temurin
          java-version: |
            8
            21
      - uses: actions/download-artifact@v4
        if: ${{ inputs.local_build && runner.os == 'macOS' }}
        with:
          name: local-macos-icon
          path: ${{ runner.temp }}/macos-icon
      - name: Verify version
        env: { RELEASE_VERSION: "${{ inputs.version }}" }
        run: |
          ./tools/check-release-version.sh
          bash tools/check-tree-drift.sh
          if [ "$RUNNER_OS" != Windows ]; then bash launcher/tools/test-release-workflows.sh; fi
          test "$(sed -n 's/^mod_version=//p' gradle.properties)" = "$RELEASE_VERSION"
      - name: Build private mod resources
        env:
          BACKEND_URL: ${{ secrets.COBBLIFY_BACKEND_URL }}
          BACKEND_TOKEN: ${{ secrets.COBBLIFY_BACKEND_TOKEN }}
          WEAVE_AGENT_PASSPHRASE: ${{ secrets.WEAVE_AGENT_PASSPHRASE }}
          WEAVE_AGENT_SHA256: e63da5ed3cc85868088527cd7d49ebd708785b6567da389fe89a89913ef4afd2
        run: |
          export ORG_GRADLE_PROJECT_cobblifyBackendUrl="$BACKEND_URL"
          export ORG_GRADLE_PROJECT_cobblifyBackendToken="$BACKEND_TOKEN"
          export GRADLE_USER_HOME="${GRADLE_USER_HOME:-$RUNNER_TEMP/gradle-home}"
          ./gradlew :1.8.9-forge:assemble --no-daemon
          (cd lunar && ./gradlew assemble --no-daemon -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64)
          test -n "$WEAVE_AGENT_PASSPHRASE"
          node launcher/tools/weave-agent-crypto.mjs decrypt \
            launcher/vendor/Weave-Loader-Agent-1.3.3.jar.enc \
            "$RUNNER_TEMP/Weave-Loader-Agent-1.3.3.jar"
          node launcher/tools/verify-file-sha256.mjs "$RUNNER_TEMP/Weave-Loader-Agent-1.3.3.jar" "$WEAVE_AGENT_SHA256"
          node launcher/tools/stage-update-resources.mjs launcher/src-tauri/resources \
            "lunar/build/libs/Cobblify-Lunar-${{ inputs.version }}.jar" \
            "$RUNNER_TEMP/Weave-Loader-Agent-1.3.3.jar" \
            "versions/1.8.9-forge/build/libs/Cobblify-1.8.9-forge-${{ inputs.version }}.jar" \
            "${{ inputs.version }}"
      - name: Build universal signed updater artifact
        working-directory: launcher
        env:
          COBBLIFY_UPDATE_URL: ${{ secrets.COBBLIFY_UPDATE_URL }}
          COBBLIFY_UPDATE_TOKEN: ${{ secrets.COBBLIFY_BACKEND_TOKEN }}
          COBBLIFY_UPDATER_PUBKEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci
          npm test
          if [ "${COBBLIFY_LOCAL_CI:-}" = 1 ]; then
            npm run build
            cargo test --locked --manifest-path src-tauri/Cargo.toml
            node --input-type=module -e 'import {rmSync} from "node:fs"; import {join} from "node:path"; const root=process.env.COBBLIFY_CI_CACHE; if (!root) throw new Error("missing private cache root"); const target=process.env.RUNNER_OS === "macOS" ? "universal-apple-darwin/release/bundle" : "release/bundle"; rmSync(join(root,"cargo",target),{recursive:true,force:true});'
          fi
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          # The whole build uses the newest Xcode 26. Linked against an older SDK, the app runs in macOS 26's
          # compatibility mode: the pre-26 window frame and window buttons, unlike every other app. Only
          # Xcode 26's actool compiles icons/Cobblify.icon (the light and dark app icon) into Assets.car; an
          # older one makes Tauri skip it silently.
          # actool's stdin is /dev/null: under Tauri's inherited stdin it prints "Bad file descriptor", exits 0
          # and writes nothing (tauri-apps/tauri#15315, fix pending in #15991).
          mkdir -p "$RUNNER_TEMP/xcode26-bin"
          if [ "${COBBLIFY_LOCAL_CI:-}" = 1 ]; then
            export SDKROOT=/Library/Developer/CommandLineTools/SDKs/MacOSX26.5.sdk
            test -d "$SDKROOT"
            python3 ../tools/local-ci/icon-assets.py verify src-tauri/icons/Cobblify.icon "$RUNNER_TEMP/macos-icon"
            export COBBLIFY_ICON_ASSETS="$RUNNER_TEMP/macos-icon"
            cp ../tools/local-ci/actool.py "$RUNNER_TEMP/xcode26-bin/actool"
          else
            xcode26=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
            test -n "$xcode26"
            export DEVELOPER_DIR="$xcode26/Contents/Developer"
            printf '#!/bin/sh\nDEVELOPER_DIR="%s/Contents/Developer" exec /usr/bin/xcrun actool "$@" < /dev/null\n' "$xcode26" > "$RUNNER_TEMP/xcode26-bin/actool"
          fi
          chmod +x "$RUNNER_TEMP/xcode26-bin/actool"
          export PATH="$RUNNER_TEMP/xcode26-bin:$PATH"
          actool --version --output-format human-readable-text
          config=$(printf '{"version":"%s","bundle":{"createUpdaterArtifacts":true}}' "$BUILD_VERSION")
          npx tauri build --target universal-apple-darwin --bundles app --ci --config "$config"
          bundle_dir="${CARGO_TARGET_DIR:-src-tauri/target}/universal-apple-darwin/release/bundle/macos"
          app_count=$(find "$bundle_dir" -maxdepth 1 -name '*.app' -type d | wc -l | tr -d '[:space:]')
          test "$app_count" = 1
          app=$(find "$bundle_dir" -maxdepth 1 -name '*.app' -type d -print -quit)
          test -f "$app/Contents/Resources/Assets.car"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$app/Contents/Info.plist"
          exe="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          for arch in arm64 x86_64; do
            otool -arch "$arch" -l "$exe" | grep -E '^ *sdk 26\.'
          done
          codesign --verify --deep --strict "$app"
          # The install image is a plain hdiutil disk image, not Tauri's dmg bundle: that
          # one lays the window out through Finder AppleScript, which needs automation
          # permission the runner cannot grant. The Applications link is the drag target
          # and the readme rides inside, so the one .dmg is the whole Mac install.
          install_dir="$RUNNER_TEMP/Cobblify-Mac-${{ inputs.version }}"
          mkdir "$install_dir"
          cp -R "$app" "$install_dir/"
          cp "friend/MAC INSTALL.txt" "$install_dir/"
          ln -s /Applications "$install_dir/Applications"
          install_dmg="$bundle_dir/Cobblify-Launcher-$BUILD_VERSION.dmg"
          hdiutil create -srcfolder "$install_dir" -volname "Cobblify Launcher" -fs HFS+ -format UDZO -ov "$install_dmg"
          verify_dir="$RUNNER_TEMP/verify-mac-dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$verify_dir" "$install_dmg"
          codesign --verify --deep --strict "$verify_dir/$(basename "$app")"
          test -f "$verify_dir/MAC INSTALL.txt"
          test "$(readlink "$verify_dir/Applications")" = /Applications
          hdiutil detach "$verify_dir"
      - name: Locate release artifacts
        shell: bash
        working-directory: launcher
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            echo "RELEASE_BUNDLE_DIR=${CARGO_TARGET_DIR:-$PWD/src-tauri/target}/universal-apple-darwin/release/bundle/macos" >> "$GITHUB_ENV"
          else
            echo "RELEASE_BUNDLE_DIR=${CARGO_TARGET_DIR:-$PWD/src-tauri/target}/release/bundle/nsis" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-update-macos-${{ inputs.version }}
          path: |
            ${{ env.RELEASE_BUNDLE_DIR }}/*.app.tar.gz
            ${{ env.RELEASE_BUNDLE_DIR }}/*.app.tar.gz.sig
            ${{ env.RELEASE_BUNDLE_DIR }}/Cobblify-Launcher-*.dmg
          retention-days: 30
          if-no-files-found: error

      - name: Remove private intermediate resources
        if: ${{ always() && inputs.local_build }}
        shell: bash
        run: |
          node --input-type=module <<'JS_CLEAN'
          import { lstatSync, readdirSync, rmSync } from 'node:fs';
          import { join } from 'node:path';
          const root = process.env.GITHUB_WORKSPACE;
          for (const relative of ['launcher/src-tauri/resources', 'lunar/build', 'versions/1.8.9-forge/build']) {
            const folder = join(root, relative);
            let stat; try { stat = lstatSync(folder); } catch (e) { if (e.code === 'ENOENT') continue; throw e; }
            if (stat.isSymbolicLink()) throw new Error('refusing symlink cleanup');
            if (relative.endsWith('resources')) {
              for (const name of readdirSync(folder)) if (name.endsWith('.jar') || name === 'manifest.json') rmSync(join(folder, name));
            } else rmSync(folder, { recursive: true });
          }
          JS_CLEAN

  windows:
    needs: [local-assets]
    if: ${{ !cancelled() && (needs.local-assets.result == 'success' || (!inputs.local_build && needs.local-assets.result == 'skipped')) }}
    runs-on: ${{ inputs.local_build && fromJSON(format('["cobblify-{0}-windows"]', inputs.local_id)) || 'windows-latest' }}
    timeout-minutes: 45
    concurrency:
      group: ${{ inputs.local_build && 'local-windows-build' || format('hosted-windows-{0}', github.run_id) }}
      cancel-in-progress: false
    environment: launcher-stable
    env:
      # Keep checkout bytes identical to the index without changing either user's git settings.
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Configure private local caches
        if: ${{ inputs.local_build }}
        shell: bash
        run: |
          test -n "$COBBLIFY_CI_CACHE"
          mkdir -p "$COBBLIFY_CI_CACHE/gradle" "$COBBLIFY_CI_CACHE/cargo"
          echo "GRADLE_USER_HOME=$COBBLIFY_CI_CACHE/gradle" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$COBBLIFY_CI_CACHE/cargo" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = macOS ]; then
            jdk21=$(/usr/libexec/java_home -v 21)
            jdk8=/Library/Java/JavaVirtualMachines/zulu-8.jdk/Contents/Home
            test -x "$jdk8/bin/java"
            echo "SDKROOT=/Library/Developer/CommandLineTools/SDKs/MacOSX26.5.sdk" >> "$GITHUB_ENV"
            echo "JAVA_HOME=$jdk21" >> "$GITHUB_ENV"
            echo "JAVA_HOME_8_X64=$jdk8" >> "$GITHUB_ENV"
            echo "$jdk21/bin" >> "$GITHUB_PATH"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - uses: actions/setup-java@v4
        if: ${{ !inputs.local_build || runner.os != 'macOS' }}
        with:
          distribution: temurin
          java-version: |
            8
            21
      - name: Verify version
        shell: bash
        env: { RELEASE_VERSION: "${{ inputs.version }}" }
        run: |
          ./tools/check-release-version.sh
          bash tools/check-tree-drift.sh
          if [ "$RUNNER_OS" != Windows ]; then bash launcher/tools/test-release-workflows.sh; fi
          test "$(sed -n 's/^mod_version=//p' gradle.properties)" = "$RELEASE_VERSION"
      - name: Build private mod resources
        shell: bash
        env:
          BACKEND_URL: ${{ secrets.COBBLIFY_BACKEND_URL }}
          BACKEND_TOKEN: ${{ secrets.COBBLIFY_BACKEND_TOKEN }}
          WEAVE_AGENT_PASSPHRASE: ${{ secrets.WEAVE_AGENT_PASSPHRASE }}
          WEAVE_AGENT_SHA256: e63da5ed3cc85868088527cd7d49ebd708785b6567da389fe89a89913ef4afd2
        run: |
          export ORG_GRADLE_PROJECT_cobblifyBackendUrl="$BACKEND_URL"
          export ORG_GRADLE_PROJECT_cobblifyBackendToken="$BACKEND_TOKEN"
          export GRADLE_USER_HOME="${GRADLE_USER_HOME:-$RUNNER_TEMP/gradle-home}"
          ./gradlew.bat :1.8.9-forge:assemble --no-daemon
          (cd lunar && ./gradlew.bat assemble --no-daemon -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64)
          test -n "$WEAVE_AGENT_PASSPHRASE"
          node launcher/tools/weave-agent-crypto.mjs decrypt \
            launcher/vendor/Weave-Loader-Agent-1.3.3.jar.enc \
            "$RUNNER_TEMP/Weave-Loader-Agent-1.3.3.jar"
          node launcher/tools/verify-file-sha256.mjs "$RUNNER_TEMP/Weave-Loader-Agent-1.3.3.jar" "$WEAVE_AGENT_SHA256"
          node launcher/tools/stage-update-resources.mjs launcher/src-tauri/resources \
            "lunar/build/libs/Cobblify-Lunar-${{ inputs.version }}.jar" \
            "$RUNNER_TEMP/Weave-Loader-Agent-1.3.3.jar" \
            "versions/1.8.9-forge/build/libs/Cobblify-1.8.9-forge-${{ inputs.version }}.jar" \
            "${{ inputs.version }}"
      - name: Build NSIS signed updater artifact
        shell: bash
        working-directory: launcher
        env:
          COBBLIFY_UPDATE_URL: ${{ secrets.COBBLIFY_UPDATE_URL }}
          COBBLIFY_UPDATE_TOKEN: ${{ secrets.COBBLIFY_BACKEND_TOKEN }}
          COBBLIFY_UPDATER_PUBKEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci
          npm test
          if [ "${COBBLIFY_LOCAL_CI:-}" = 1 ]; then
            npm run build
            cargo test --locked --manifest-path src-tauri/Cargo.toml
            node --input-type=module -e 'import {rmSync} from "node:fs"; import {join} from "node:path"; const root=process.env.COBBLIFY_CI_CACHE; if (!root) throw new Error("missing private cache root"); const target=process.env.RUNNER_OS === "macOS" ? "universal-apple-darwin/release/bundle" : "release/bundle"; rmSync(join(root,"cargo",target),{recursive:true,force:true});'
          fi
          config=$(printf '{"version":"%s","bundle":{"createUpdaterArtifacts":true}}' "$BUILD_VERSION")
          npx tauri build --bundles nsis --ci --config "$config"
          bundle_dir="${CARGO_TARGET_DIR:-src-tauri/target}/release/bundle/nsis"
          test "$(find "$bundle_dir" -maxdepth 1 -name '*-setup.exe' -type f | wc -l | tr -d '[:space:]')" = 1
          test "$(find "$bundle_dir" -maxdepth 1 -name '*-setup.exe.sig' -type f | wc -l | tr -d '[:space:]')" = 1
      - name: Locate release artifacts
        shell: bash
        working-directory: launcher
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            echo "RELEASE_BUNDLE_DIR=${CARGO_TARGET_DIR:-$PWD/src-tauri/target}/universal-apple-darwin/release/bundle/macos" >> "$GITHUB_ENV"
          else
            echo "RELEASE_BUNDLE_DIR=${CARGO_TARGET_DIR:-$PWD/src-tauri/target}/release/bundle/nsis" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-update-windows-${{ inputs.version }}
          path: |
            ${{ env.RELEASE_BUNDLE_DIR }}/*-setup.exe
            ${{ env.RELEASE_BUNDLE_DIR }}/*-setup.exe.sig
          retention-days: 30
          if-no-files-found: error

      - name: Remove private intermediate resources
        if: ${{ always() && inputs.local_build }}
        shell: bash
        run: |
          node --input-type=module <<'JS_CLEAN'
          import { lstatSync, readdirSync, rmSync } from 'node:fs';
          import { join } from 'node:path';
          const root = process.env.GITHUB_WORKSPACE;
          for (const relative of ['launcher/src-tauri/resources', 'lunar/build', 'versions/1.8.9-forge/build']) {
            const folder = join(root, relative);
            let stat; try { stat = lstatSync(folder); } catch (e) { if (e.code === 'ENOENT') continue; throw e; }
            if (stat.isSymbolicLink()) throw new Error('refusing symlink cleanup');
            if (relative.endsWith('resources')) {
              for (const name of readdirSync(folder)) if (name.endsWith('.jar') || name === 'manifest.json') rmSync(join(folder, name));
            } else rmSync(folder, { recursive: true });
          }
          JS_CLEAN

  ready:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Record candidate identity
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          mkdir candidate-metadata
          jq -n \
            --arg version "$RELEASE_VERSION" \
            --arg buildVersion "$BUILD_VERSION" \
            --arg commit "$GITHUB_SHA" \
            --arg runId "$GITHUB_RUN_ID" \
            '{version: $version, buildVersion: $buildVersion, commit: $commit, runId: $runId}' \
            > candidate-metadata/candidate.json
          {
            echo "## Candidate ready"
            echo
            if [ "$BUILD_VERSION" != "$RELEASE_VERSION" ]; then
              echo "Dev build \`$BUILD_VERSION\`; the publish-dev job puts it on the dev channel."
              echo "Dev builds are never promoted: release the plain version with a fresh candidate."
            else
              echo "Test the Mac artifact from run \`$GITHUB_RUN_ID\`."
              echo "If it passes, run **Promote Launcher Update** with candidate run ID \`$GITHUB_RUN_ID\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-update-metadata-${{ inputs.version }}
          path: candidate-metadata/candidate.json
          retention-days: 30
          if-no-files-found: error

  # Opt-in only. Writes releases/<version>-dev.<run>/ and channels/dev.json; never stable.
  # Launchers with "Test dev builds" ticked ask for the dev channel and get whichever of
  # stable/dev is newer, so a dev build reaches only launchers older than this branch's pins.
  publish-dev:
    if: ${{ inputs.publish_dev }}
    needs: [macos, windows, ready]
    runs-on: ubuntu-latest
    environment: launcher-stable
    concurrency:
      group: launcher-dev-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v4
        with:
          pattern: launcher-update-*-${{ inputs.version }}
          path: candidate
          merge-multiple: true
      - name: Validate the build this run produced
        run: |
          test "$(jq -r .buildVersion candidate/candidate.json)" = "$BUILD_VERSION"
          test "$(jq -r .runId candidate/candidate.json)" = "$GITHUB_RUN_ID"
          case "$BUILD_VERSION" in *-dev.*) ;; *) echo "not a dev version: $BUILD_VERSION" >&2; exit 1 ;; esac
          test "$(find candidate -maxdepth 1 -name '*.app.tar.gz' -type f | wc -l | tr -d '[:space:]')" = 1
          test "$(find candidate -maxdepth 1 -name '*.app.tar.gz.sig' -type f | wc -l | tr -d '[:space:]')" = 1
          test "$(find candidate -maxdepth 1 -name '*-setup.exe' -type f | wc -l | tr -d '[:space:]')" = 1
          test "$(find candidate -maxdepth 1 -name '*-setup.exe.sig' -type f | wc -l | tr -d '[:space:]')" = 1
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build and sign the dev manifest
        working-directory: launcher
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Dev builds never force an update: the floor is 0.0.0. Stable's floor still applies
          # whenever stable is the newer of the two manifests.
          printf '{"minimumSupportedVersion":"0.0.0"}' > ../candidate/policy.json
          npm ci
          npx tauri signer sign ../candidate/policy.json
          mac=$(find ../candidate -maxdepth 1 -name '*.app.tar.gz' -type f -print -quit)
          win=$(find ../candidate -maxdepth 1 -name '*-setup.exe' -type f -print -quit)
          node tools/build-update-manifest.mjs ../candidate/dev.json \
            "$BUILD_VERSION" 0.0.0 "Dev build from $GITHUB_REF_NAME" \
            "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "$mac" "$mac.sig" "$win" "$win.sig" ../candidate/policy.json.sig
      - name: Refuse to move the dev channel backwards
        working-directory: server/stats-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUCKET: ${{ vars.COBBLIFY_UPDATE_BUCKET }}
        run: |
          npm ci
          # The channel only ever advances. A lower version would never be offered to a
          # launcher already on the current dev build, and retention would delete it.
          # Any failure other than "no such key" used to be treated as "no dev channel yet",
          # which skipped the forward-only guard entirely: classify the read instead.
          if out=$(npx wrangler r2 object get "$BUCKET/channels/dev.json" --file "$RUNNER_TEMP/current-dev.json" --remote 2>&1); then
            current=$(jq -r .version "$RUNNER_TEMP/current-dev.json")
            order=$(node ../../launcher/tools/semver-compare.mjs "$BUILD_VERSION" "$current")
            if [ "$order" != 1 ]; then
              echo "dev channel is already at $current; $BUILD_VERSION is not newer. Bump the branch's pins first." >&2
              exit 1
            fi
          elif printf '%s\n' "$out" | grep -q 'The specified key does not exist'; then
            echo "no dev channel yet; $BUILD_VERSION will be the first"
          else
            printf '%s\n' "$out" >&2
            echo "could not read channels/dev.json; refusing to publish blind" >&2
            exit 1
          fi
      - name: Upload dev artifacts, then switch the dev channel
        working-directory: server/stats-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUCKET: ${{ vars.COBBLIFY_UPDATE_BUCKET }}
        run: |
          mac=$(find ../../candidate -maxdepth 1 -name '*.app.tar.gz' -type f -print -quit)
          win=$(find ../../candidate -maxdepth 1 -name '*-setup.exe' -type f -print -quit)
          npx wrangler r2 object put "$BUCKET/releases/$BUILD_VERSION/Cobblify-Launcher-macos-universal.app.tar.gz" --file "$mac" --remote
          npx wrangler r2 object put "$BUCKET/releases/$BUILD_VERSION/Cobblify-Launcher-windows-x86_64-setup.exe" --file "$win" --remote
          npx wrangler r2 object put "$BUCKET/channels/dev.json" --file ../../candidate/dev.json --content-type application/json --remote
      - name: Retain only the newest two dev releases
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ vars.COBBLIFY_UPDATE_BUCKET }}
        run: |
          # Never the build the channel now points at, whatever the version sort says.
          versions=$(aws s3api list-objects-v2 --bucket "$BUCKET" --prefix releases/ --endpoint-url "$R2_ENDPOINT" --query 'Contents[].Key' --output text | tr '\t' '\n' | awk -F/ 'NF >= 3 {print $2}' | grep -e '-dev[.]' | grep -v -x -F "$BUILD_VERSION" | sort -Vu)
          printf '%s\n' "$versions" | sort -Vr | tail -n +2 | while read -r old; do
            [ -z "$old" ] || aws s3 rm "s3://$BUCKET/releases/$old/" --recursive --endpoint-url "$R2_ENDPOINT"
          done
      - name: Summary
        run: |
          {
            echo "## Dev channel updated"
            echo
            echo "\`channels/dev.json\` now points at \`$BUILD_VERSION\`."
            echo "Launchers with **Test dev builds (unstable)** ticked and a version below \`${{ inputs.version }}\` will be offered it on their next check."
          } >> "$GITHUB_STEP_SUMMARY"
