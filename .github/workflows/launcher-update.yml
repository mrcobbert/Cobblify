name: Launcher Update Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact repo version to build
        required: true
      minimum_supported_version:
        description: Oldest launcher allowed to start a new game
        required: true
      notes:
        description: Short launcher update note
        required: true
      release_notes_url:
        description: HTTPS release notes URL
        required: true
      promote:
        description: Promote this candidate to stable after both builds pass
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: launcher-update-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-15
    environment: launcher-release
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            21
      - name: Verify version
        env: { RELEASE_VERSION: "${{ inputs.version }}" }
        run: |
          ./tools/check-release-version.sh
          test "$(sed -n 's/^mod_version=//p' gradle.properties)" = "$RELEASE_VERSION"
      - name: Build private mod resources
        env:
          BACKEND_URL: ${{ secrets.COBBLIFY_BACKEND_URL }}
          BACKEND_TOKEN: ${{ secrets.COBBLIFY_BACKEND_TOKEN }}
          WEAVE_AGENT_B64: ${{ secrets.WEAVE_AGENT_B64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/gradle-home"
          printf 'cobblifyBackendUrl=%s\ncobblifyBackendToken=%s\n' "$BACKEND_URL" "$BACKEND_TOKEN" > "$RUNNER_TEMP/gradle-home/gradle.properties"
          GRADLE_USER_HOME="$RUNNER_TEMP/gradle-home" ./gradlew :1.8.9-forge:assemble --no-daemon
          (cd lunar && GRADLE_USER_HOME="$RUNNER_TEMP/gradle-home" ./gradlew assemble --no-daemon -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64)
          printf '%s' "$WEAVE_AGENT_B64" | base64 --decode > "$RUNNER_TEMP/Weave-Loader-Agent-1.3.3.jar"
          node launcher/tools/stage-update-resources.mjs launcher/src-tauri/resources \
            "lunar/build/libs/Cobblify-Lunar-${{ inputs.version }}.jar" \
            "$RUNNER_TEMP/Weave-Loader-Agent-1.3.3.jar" \
            "versions/1.8.9-forge/build/libs/Cobblify-1.8.9-forge-${{ inputs.version }}.jar" \
            "${{ inputs.version }}"
      - name: Build universal signed updater artifact
        working-directory: launcher
        env:
          COBBLIFY_UPDATE_URL: ${{ secrets.COBBLIFY_UPDATE_URL }}
          COBBLIFY_UPDATE_TOKEN: ${{ secrets.COBBLIFY_BACKEND_TOKEN }}
          COBBLIFY_UPDATER_PUBKEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          npx tauri build --target universal-apple-darwin --bundles app --no-sign --ci \
            --config '{"bundle":{"createUpdaterArtifacts":true}}'
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-update-macos-${{ inputs.version }}
          path: |
            launcher/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            launcher/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          retention-days: 30

  windows:
    runs-on: windows-latest
    environment: launcher-release
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            21
      - name: Verify version
        shell: bash
        env: { RELEASE_VERSION: "${{ inputs.version }}" }
        run: |
          ./tools/check-release-version.sh
          test "$(sed -n 's/^mod_version=//p' gradle.properties)" = "$RELEASE_VERSION"
      - name: Build private mod resources
        shell: bash
        env:
          BACKEND_URL: ${{ secrets.COBBLIFY_BACKEND_URL }}
          BACKEND_TOKEN: ${{ secrets.COBBLIFY_BACKEND_TOKEN }}
          WEAVE_AGENT_B64: ${{ secrets.WEAVE_AGENT_B64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/gradle-home"
          printf 'cobblifyBackendUrl=%s\ncobblifyBackendToken=%s\n' "$BACKEND_URL" "$BACKEND_TOKEN" > "$RUNNER_TEMP/gradle-home/gradle.properties"
          GRADLE_USER_HOME="$RUNNER_TEMP/gradle-home" ./gradlew.bat :1.8.9-forge:assemble --no-daemon
          (cd lunar && GRADLE_USER_HOME="$RUNNER_TEMP/gradle-home" ./gradlew.bat assemble --no-daemon -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64)
          printf '%s' "$WEAVE_AGENT_B64" | base64 --decode > "$RUNNER_TEMP/Weave-Loader-Agent-1.3.3.jar"
          node launcher/tools/stage-update-resources.mjs launcher/src-tauri/resources \
            "lunar/build/libs/Cobblify-Lunar-${{ inputs.version }}.jar" \
            "$RUNNER_TEMP/Weave-Loader-Agent-1.3.3.jar" \
            "versions/1.8.9-forge/build/libs/Cobblify-1.8.9-forge-${{ inputs.version }}.jar" \
            "${{ inputs.version }}"
      - name: Build NSIS signed updater artifact
        working-directory: launcher
        env:
          COBBLIFY_UPDATE_URL: ${{ secrets.COBBLIFY_UPDATE_URL }}
          COBBLIFY_UPDATE_TOKEN: ${{ secrets.COBBLIFY_BACKEND_TOKEN }}
          COBBLIFY_UPDATER_PUBKEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci
          npx tauri build --bundles nsis --no-sign --ci \
            --config '{"bundle":{"createUpdaterArtifacts":true}}'
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-update-windows-${{ inputs.version }}
          path: |
            launcher/src-tauri/target/release/bundle/nsis/*-setup.exe
            launcher/src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          retention-days: 30

  promote:
    if: inputs.promote
    needs: [macos, windows]
    runs-on: ubuntu-latest
    environment: launcher-stable
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with:
          pattern: launcher-update-*-${{ inputs.version }}
          path: candidate
          merge-multiple: true
      - name: Build and sign immutable manifest
        working-directory: launcher
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE_VERSION: ${{ inputs.version }}
          MINIMUM_VERSION: ${{ inputs.minimum_supported_version }}
          RELEASE_NOTES: ${{ inputs.notes }}
          RELEASE_NOTES_URL: ${{ inputs.release_notes_url }}
        run: |
          printf '{"minimumSupportedVersion":"%s"}' "$MINIMUM_VERSION" > ../candidate/policy.json
          npm ci
          npx tauri signer sign ../candidate/policy.json
          mac=$(find ../candidate -name '*.app.tar.gz' -type f -print -quit)
          win=$(find ../candidate -name '*-setup.exe' -type f -print -quit)
          node tools/build-update-manifest.mjs ../candidate/stable.json \
            "$RELEASE_VERSION" "$MINIMUM_VERSION" "$RELEASE_NOTES" "$RELEASE_NOTES_URL" \
            "$mac" "$mac.sig" "$win" "$win.sig" ../candidate/policy.json.sig
      - name: Upload candidate, then atomically promote stable manifest
        working-directory: server/stats-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUCKET: ${{ vars.COBBLIFY_UPDATE_BUCKET }}
        run: |
          npm ci
          npx wrangler r2 object put "$BUCKET/releases/${{ inputs.version }}/Cobblify-Launcher-macos-universal.app.tar.gz" --file ../../candidate/$(basename "$(find ../../candidate -name '*.app.tar.gz' -type f -print -quit)") --remote
          npx wrangler r2 object put "$BUCKET/releases/${{ inputs.version }}/Cobblify-Launcher-windows-x86_64-setup.exe" --file ../../candidate/$(basename "$(find ../../candidate -name '*-setup.exe' -type f -print -quit)") --remote
          npx wrangler r2 object put "$BUCKET/channels/stable.json" --file ../../candidate/stable.json --content-type application/json --remote
      - name: Retain only the newest three immutable releases
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ vars.COBBLIFY_UPDATE_BUCKET }}
        run: |
          versions=$(aws s3api list-objects-v2 --bucket "$BUCKET" --prefix releases/ --endpoint-url "$R2_ENDPOINT" --query 'Contents[].Key' --output text | tr '\t' '\n' | awk -F/ 'NF >= 3 {print $2}' | sort -Vu)
          printf '%s\n' "$versions" | sort -Vr | tail -n +4 | while read -r old; do
            [ -z "$old" ] || aws s3 rm "s3://$BUCKET/releases/$old/" --recursive --endpoint-url "$R2_ENDPOINT"
          done
