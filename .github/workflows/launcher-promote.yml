name: Promote Launcher Update

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Launcher Update Candidate run ID
        required: true
      version:
        description: Exact candidate version
        required: true
      minimum_supported_version:
        description: Oldest launcher allowed to start a new game
        required: true
      notes:
        description: Short launcher update note
        required: true
      release_notes_url:
        description: Public HTTPS release notes URL
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: launcher-stable-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: launcher-stable
    steps:
      - name: Validate candidate run
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          case "$CANDIDATE_RUN_ID" in
            ''|*[!0-9]*) echo "candidate run ID must be numeric" >&2; exit 1 ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" > "$RUNNER_TEMP/run.json"
          test "$(jq -r .conclusion "$RUNNER_TEMP/run.json")" = success
          test "$(jq -r .event "$RUNNER_TEMP/run.json")" = workflow_dispatch
          candidate_path=$(jq -r .path "$RUNNER_TEMP/run.json")
          case "$candidate_path" in
            .github/workflows/launcher-update.yml|.github/workflows/launcher-update.yml@*) ;;
            *) echo "run did not come from Launcher Update Candidate" >&2; exit 1 ;;
          esac
          test "$(jq -r .repository.full_name "$RUNNER_TEMP/run.json")" = "$GITHUB_REPOSITORY"
          echo "sha=$(jq -r .head_sha "$RUNNER_TEMP/run.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
          pattern: launcher-update-*-${{ inputs.version }}
          path: candidate
          merge-multiple: true
      - name: Validate downloaded candidate
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          # Dev builds (<version>-dev.<run>) live on the dev channel only; stable is always a
          # plain version built by a candidate run without publish_dev.
          case "$RELEASE_VERSION" in
            *-*) echo "refusing to promote pre-release version $RELEASE_VERSION" >&2; exit 1 ;;
          esac
          test "$(jq -r .version candidate/candidate.json)" = "$RELEASE_VERSION"
          test "$(jq -r '.buildVersion // .version' candidate/candidate.json)" = "$RELEASE_VERSION"
          test "$(jq -r .runId candidate/candidate.json)" = "$CANDIDATE_RUN_ID"
          test "$(jq -r .commit candidate/candidate.json)" = "$(jq -r .head_sha "$RUNNER_TEMP/run.json")"
          test "$(find candidate -maxdepth 1 -name '*.app.tar.gz' -type f | wc -l | tr -d '[:space:]')" = 1
          test "$(find candidate -maxdepth 1 -name '*.app.tar.gz.sig' -type f | wc -l | tr -d '[:space:]')" = 1
          test "$(find candidate -maxdepth 1 -name '*-setup.exe' -type f | wc -l | tr -d '[:space:]')" = 1
          test "$(find candidate -maxdepth 1 -name '*-setup.exe.sig' -type f | wc -l | tr -d '[:space:]')" = 1
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build and sign immutable manifest
        working-directory: launcher
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE_VERSION: ${{ inputs.version }}
          MINIMUM_VERSION: ${{ inputs.minimum_supported_version }}
          RELEASE_NOTES: ${{ inputs.notes }}
          RELEASE_NOTES_URL: ${{ inputs.release_notes_url }}
        run: |
          printf '{"minimumSupportedVersion":"%s"}' "$MINIMUM_VERSION" > ../candidate/policy.json
          npm ci
          npx tauri signer sign ../candidate/policy.json
          mac=$(find ../candidate -maxdepth 1 -name '*.app.tar.gz' -type f -print -quit)
          win=$(find ../candidate -maxdepth 1 -name '*-setup.exe' -type f -print -quit)
          node tools/build-update-manifest.mjs ../candidate/stable.json \
            "$RELEASE_VERSION" "$MINIMUM_VERSION" "$RELEASE_NOTES" "$RELEASE_NOTES_URL" \
            "$mac" "$mac.sig" "$win" "$win.sig" ../candidate/policy.json.sig
      - name: Refuse to move the stable channel backwards
        working-directory: server/stats-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUCKET: ${{ vars.COBBLIFY_UPDATE_BUCKET }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          npm ci
          # Launchers only update forward: a stable version at or below the current one is never
          # offered to anyone already on it and only confuses which build is current. Refuse it.
          # A read failure other than "no such key" is not "first release": refuse to promote blind.
          if out=$(npx wrangler r2 object get "$BUCKET/channels/stable.json" --file "$RUNNER_TEMP/current-stable.json" --remote 2>&1); then
            current=$(jq -r .version "$RUNNER_TEMP/current-stable.json")
            order=$(node ../../launcher/tools/semver-compare.mjs "$RELEASE_VERSION" "$current")
            if [ "$order" != 1 ]; then
              echo "stable is already at $current; $RELEASE_VERSION is not newer. Ship a higher version." >&2
              exit 1
            fi
          elif printf '%s\n' "$out" | grep -q 'The specified key does not exist'; then
            echo "no stable channel yet; $RELEASE_VERSION will be the first"
          else
            printf '%s\n' "$out" >&2
            echo "could not read channels/stable.json; refusing to promote blind" >&2
            exit 1
          fi
      - name: Refuse to overwrite an immutable release
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ vars.COBBLIFY_UPDATE_BUCKET }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          # R2 omits KeyCount when the prefix is empty (the CLI then prints "None"), which
          # read as "exists" and blocked every promotion. Count Contents instead - a missing
          # list is an empty one - and keep a CLI failure distinct from a real collision.
          if ! existing=$(aws s3api list-objects-v2 \
            --bucket "$BUCKET" \
            --prefix "releases/$RELEASE_VERSION/" \
            --endpoint-url "$R2_ENDPOINT" \
            --query 'length(Contents || `[]`)' \
            --output text 2>&1); then
            echo "cannot list releases/$RELEASE_VERSION/: $existing" >&2
            exit 1
          fi
          case "$existing" in
            0|None) ;;
            *)
              echo "release $RELEASE_VERSION already exists ($existing object(s)); refusing to overwrite immutable artifacts" >&2
              exit 1 ;;
          esac
      - name: Upload immutable artifacts, then atomically promote stable
        working-directory: server/stats-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUCKET: ${{ vars.COBBLIFY_UPDATE_BUCKET }}
        run: |
          npm ci
          mac=$(find ../../candidate -maxdepth 1 -name '*.app.tar.gz' -type f -print -quit)
          win=$(find ../../candidate -maxdepth 1 -name '*-setup.exe' -type f -print -quit)
          npx wrangler r2 object put "$BUCKET/releases/${{ inputs.version }}/Cobblify-Launcher-macos-universal.app.tar.gz" --file "$mac" --remote
          npx wrangler r2 object put "$BUCKET/releases/${{ inputs.version }}/Cobblify-Launcher-windows-x86_64-setup.exe" --file "$win" --remote
          npx wrangler r2 object put "$BUCKET/channels/stable.json" --file ../../candidate/stable.json --content-type application/json --remote
      - name: Retain only the newest three immutable releases
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ vars.COBBLIFY_UPDATE_BUCKET }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          # Never the release stable.json now points at, whatever the version sort says (a
          # hotfix below the newest prefixes was otherwise deleted the moment it was
          # promoted); then the newest two others. Dev prefixes are pruned by their own
          # publish job.
          versions=$(aws s3api list-objects-v2 --bucket "$BUCKET" --prefix releases/ --endpoint-url "$R2_ENDPOINT" --query 'Contents[].Key' --output text | tr '\t' '\n' | awk -F/ 'NF >= 3 {print $2}' | grep -v -e '-' | { grep -v -x -F "$RELEASE_VERSION" || true; } | sort -Vu)
          printf '%s\n' "$versions" | sort -Vr | tail -n +3 | while read -r old; do
            [ -z "$old" ] || aws s3 rm "s3://$BUCKET/releases/$old/" --recursive --endpoint-url "$R2_ENDPOINT"
          done
