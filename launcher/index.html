<!doctype html>
<html lang="en" data-font="minecraft">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>Cobblify</title>
  </head>
  <body>
    <!-- ── the 0.18 home (src/ui/app.js renders into it) ── -->
    <div class="app" id="app"></div>

    <!-- ── the post-launch dashboard: hidden until launch, then swapped in (the 0.18 board replaces it in stage 5) ── -->
    <main class="stage" id="stage" data-view="home">
      <header class="dhdr" data-tauri-drag-region><span id="dash-wm"></span></header>
      <div
        class="joining"
        id="joining"
        data-conn="joining"
        role="status"
        aria-live="polite"
        aria-atomic="true"
        aria-busy="true"
        aria-hidden="true"
      >
        <div class="ring" aria-hidden="true"></div>
        <div class="jt" id="joining-title">Joining Hypixel</div>
        <div class="js">
          <span id="joining-sub">Connecting to network</span
          ><span class="dots" aria-hidden="true"></span>
        </div>
        <!-- one action slot; its label and handler come from the shell mode -->
        <button class="btn setup-btn" id="conn-action" type="button" hidden>Try Again</button>
      </div>
      <div class="dash" id="dash"></div>
      <div class="conn-announce" id="conn-announce" aria-live="polite" aria-atomic="true"></div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
