<!doctype html>
<html lang="en" data-font="minecraft">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>Cobblify</title>
  </head>
  <body>
    <!-- ── the 0.18 home (src/ui/app.js renders into it) ── -->
    <div class="app" id="app"></div>

    <!-- ── the post-launch stats board (src/board-render.js draws it): hidden until launch, then swapped in ── -->
    <main class="stage" id="stage" data-view="home">
      <!-- "deep": the whole band drags the window, the wordmark and the view's name included (Tauri's drag.js) -->
      <header class="dhdr" data-tauri-drag-region="deep">
        <span id="dash-wm"></span><span class="htitle" id="dash-title" hidden></span>
      </header>
      <div
        class="joining"
        id="joining"
        data-conn="manual"
        role="status"
        aria-live="polite"
        aria-atomic="true"
        aria-busy="false"
        aria-hidden="true"
      >
        <div class="msg">
          <div class="mt mc" id="joining-title">Ready</div>
          <div class="s mc" id="joining-sub">Launch to open Lunar or Prism.</div>
          <!-- one action slot; its label and handler come from the shell mode -->
          <div class="act" id="conn-act" hidden>
            <button class="key acc hero" id="conn-action" type="button" hidden>Try Again</button>
          </div>
        </div>
      </div>
      <div class="dash" id="dash" aria-hidden="true"></div>
      <div class="conn-announce" id="conn-announce" aria-live="polite" aria-atomic="true"></div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
