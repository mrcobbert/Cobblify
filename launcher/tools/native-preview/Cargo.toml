[package]
name = "cobblify-gui-test"
version = "0.0.0"
edition = "2021"

[dependencies]
tauri = "=2.11.5"
objc = "0.2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSView"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSNotification", "NSOperation", "block2"] }

[build-dependencies]
tauri-build = "=2.6.3"
