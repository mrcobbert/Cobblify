[package]
name = "cobblify-launcher"
version = "0.1.0"
description = "Cobblify Launcher"
edition = "2021"
# Verified toolchain. sysinfo 0.39 needs 1.95, which is not installed, hence the 0.38 pin below.
rust-version = "1.94"
publish = false

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order keeps Lunar's own launcher.json key order intact when we rewrite it.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
# Pinned to 0.38: 0.39 requires Rust 1.95. Only src/proc.rs may use this crate.
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
tauri = { version = "2.11", features = [] }
# The native folder picker, used ONLY from Rust (`app.dialog()`), never invoked from the
# frontend - so the choice command still owns validation and the webview is never handed a
# filesystem API. This is the fallback that makes Forge support launcher-agnostic: a moved
# CurseForge root, portable Prism, MultiMC or a hand-rolled instance all arrive this way.
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
# ShellExecute-based deep-link open; `cmd /C start` is banned (console flash,
# breaks on `&` in the URL).
tauri-plugin-opener = "2"
# Raw Win32 for src/hide_windows.rs only: window enumeration, ShowWindowAsync,
# and the console-ownership lookup. 0.61 is already in the lock file via tauri's
# own dependency tree, so this adds no new crate version to the build.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Console",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
