[package]
name = "cobblify-launcher"
version = "0.16.0"
description = "Cobblify Launcher"
edition = "2021"
# Verified toolchain. sysinfo 0.39 needs 1.95, which is not installed, hence the 0.38 pin below.
rust-version = "1.94"
publish = false

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order keeps Lunar's own launcher.json key order intact when we rewrite it.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
atomic-write-file = "0.3"
fs2 = "0.4"
# Pinned to 0.38: 0.39 requires Rust 1.95. Only src/proc.rs may use this crate.
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
tauri = { version = "2.11", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json"] }
futures-util = "0.3"
semver = "1"
tokio = { version = "1", features = ["fs", "io-util", "sync"] }
base64 = "0.22"
minisign-verify = "0.2"

[target.'cfg(windows)'.dependencies]
# ShellExecute-based deep-link open; `cmd /C start` is banned (console flash,
# breaks on `&` in the URL).
tauri-plugin-opener = "2"
# Raw Win32 for src/hide_windows.rs (window enumeration, ShowWindowAsync,
# console-ownership lookup) and src/proc.rs (K32EnumProcesses, the
# scan-completeness reconciliation source). 0.61 is already in the lock file
# via tauri's own dependency tree, so this adds no new crate version.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  # Only for SYNCHRONIZE, which this crate files here as a FILE_ACCESS_RIGHTS even
  # though it is a generic access right (see src/process_liveness.rs).
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
