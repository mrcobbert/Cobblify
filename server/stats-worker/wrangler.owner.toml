# OWNER deployment config - identical to wrangler.toml but with the owner's STATS_KV
# binding enabled. Urchin data/key routes are deliberately inert without STATS_KV, so the
# owner MUST deploy with: npm run deploy:owner  (a plain `wrangler deploy` would strip the
# binding and silently disable Urchin). The namespace id is not a secret; it only exists in
# the owner's Cloudflare account. Third parties keep using wrangler.toml.
name = "bedwarsqol-stats"
main = "src/worker.js"
compatibility_date = "2024-11-01"
workers_dev = true
preview_urls = true

# STATS_TOKEN (secret): comma-separated token list, one entry per user
# (the parser splits on ",", trims, drops empties, dedupes; every entry must match
# ^[A-Za-z0-9_-]{16,64}$ - malformed entries are DROPPED and never authenticate; a list
# with zero valid entries denies every authenticated route, it never falls open).
# The FIRST valid entry is the OWNER: the URCHIN_KEY/SERAPH_KEY secrets, when set, manage
# the owner's provider-key slot only; every other identity manages its own slot via the key
# routes. Revocation = remove the entry and redeploy. Set: wrangler secret put STATS_TOKEN
#
# One-time owner steps after first deploying the multi-token Worker (provider state became
# per-identity - nothing reads the legacy unsuffixed KV entries anymore):
#   1. Re-paste your Urchin and Seraph keys once (POST /urchin/key + /seraph/key, via the
#      owner-only /cobblify urchinkey|seraphkey commands).
#   2. Delete the legacy unsuffixed entries:
#        wrangler kv key delete --namespace-id 16fd5eea0e37475c91e5f255d45d82ce "urchin:cfg:key"
#      and likewise urchin:cfg:backoff, urchin:cfg:disabled, seraph:cfg:key,
#      seraph:cfg:backoff, seraph:cfg:disabled.

# Run the Worker near hypixel.net (it makes many same-origin subrequests), trimming per-scrape
# latency. Takes ~15 min to take effect after deploy and only routes to colos it has run in.
# TEMPORARILY DISABLED 2026-07-23: smart placement pinned egress to the Miami (SMF) colo whose IP
# hypixel's Cloudflare was persistently challenging (403). mode="off" force-clears the sticky
# server-side placement (merely omitting the block leaves it pinned). Re-enable once the block clears.
[placement]
mode = "off"

# Namespace for the per-identity Urchin/Seraph API keys + backoff/disabled state, the "origin
# blocked" breaker, and the stats L2: positive and NICKED player results are cached in KV when
# this binding exists (transient negatives stay per-colo L1 only). A deployment without the
# binding loses provider tags (unavailable) and cross-colo stats reuse, but stats still work
# off the per-colo caches.default alone - which is why the owner deploy must keep it.
# To enable it on your own account, create a namespace and uncomment the three lines with your id:
#   wrangler kv namespace create STATS_KV
[[kv_namespaces]]
binding = "STATS_KV"
id = "16fd5eea0e37475c91e5f255d45d82ce"

# Daily probe plus launcher-event retention cleanup.
[triggers]
crons = ["0 12 * * *"]

# Optional: set after first deploy, e.g. WORKER_URL=https://bedwarsqol-stats.<subdomain>.workers.dev
# Used by: npm run test:worker

# Launcher update resources are not checked in because their account IDs are
# deployment-specific. Provision once, then add these owner-only bindings:
# [[r2_buckets]]
# binding = "UPDATE_BUCKET"
# bucket_name = "cobblify-launcher-updates"
# [[d1_databases]]
# binding = "UPDATE_EVENTS"
# database_name = "cobblify-launcher-update-events"
# database_id = "<database-id>"
# Set the ticket-signing secret with: wrangler secret put UPDATE_URL_SECRET
