name = "bedwarsqol-stats"
main = "src/worker.js"
compatibility_date = "2024-11-01"
workers_dev = true
preview_urls = true

# STATS_TOKEN (secret, optional): comma-separated token list, one entry per user
# (the parser splits on ",", trims, drops empties, dedupes; every entry must match
# ^[A-Za-z0-9_-]{16,64}$ - malformed entries are DROPPED and never authenticate).
# The FIRST valid entry is the OWNER: the URCHIN_KEY/SERAPH_KEY secrets, when set, manage
# the owner's provider-key slot only. Every other identity manages its own slot via the key
# routes. Unset => the Worker is open (self-host back-compat) and all provider routes stay
# fail-closed. Set-but-all-invalid => every authenticated route is denied (fail closed).
# Set it with: wrangler secret put STATS_TOKEN

# Run the Worker near hypixel.net (it makes many same-origin subrequests), trimming per-scrape
# latency. Takes ~15 min to take effect after deploy and only routes to colos it has run in.
[placement]
mode = "smart"

# Namespace for the per-identity Urchin/Seraph API keys + backoff/disabled state, the "origin
# blocked" breaker, and the stats L2: positive and NICKED player results are cached in KV when
# this binding exists (transient negatives stay per-colo L1 only). OFF by default so anyone can
# deploy to their own Cloudflare account — a KV binding must reference a namespace that exists
# in THAT account, and a hardcoded id from someone else's account makes `wrangler deploy` fail.
# Without this binding provider tags resolve unavailable, the breaker keeps working off the
# per-colo caches.default alone, and stats still work (L1-only, no cross-colo reuse).
# To enable it on your own account, create a namespace and uncomment the three lines with your id:
#   wrangler kv namespace create STATS_KV
# [[kv_namespaces]]
# binding = "STATS_KV"
# id = "<your-namespace-id>"

# Optional: uncomment to re-run edge probe via `wrangler tail` (see README)
# [triggers]
# crons = ["0 12 * * *"]

# Optional: set after first deploy, e.g. WORKER_URL=https://bedwarsqol-stats.<subdomain>.workers.dev
# Used by: npm run test:worker

# Private launcher updates are owner-operated and intentionally disabled in
# this portable config. Self-hosters can create the resources, apply
# migrations/0001_launcher_update_events.sql, then add UPDATE_BUCKET (R2) and
# UPDATE_EVENTS (D1) bindings. UPDATE_URL_SECRET is a Wrangler secret.
