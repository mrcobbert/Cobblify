name = "bedwarsqol-stats"
main = "src/worker.js"
compatibility_date = "2024-11-01"
workers_dev = true
preview_urls = true

# STATS_TOKEN (secret, optional): comma-separated token list, one entry per user
# (charset ^[A-Za-z0-9_-]{16,64}$; the parser splits on ",", trims, drops empties, dedupes).
# The FIRST entry is the OWNER: the URCHIN_KEY/SERAPH_KEY secrets, when set, manage the
# owner's provider-key slot only. Every other identity manages its own slot via the key
# routes. Unset => the Worker is open (self-host back-compat) and all provider routes stay
# fail-closed. Set it with: wrangler secret put STATS_TOKEN

# Run the Worker near hypixel.net (it makes many same-origin subrequests), trimming per-scrape
# latency. Takes ~15 min to take effect after deploy and only routes to colos it has run in.
[placement]
mode = "smart"

# Namespace for the Urchin/Seraph API keys and the "origin blocked" breaker (player stats never
# touch KV). OFF by default so anyone can deploy to their own Cloudflare account — a KV binding
# must reference a namespace that exists in THAT account, and a hardcoded id from someone else's
# account makes `wrangler deploy` fail. Without this binding those provider tags resolve
# unavailable and the breaker keeps working off the per-colo caches.default alone.
# To enable it on your own account, create a namespace and uncomment the three lines with your id:
#   wrangler kv namespace create STATS_KV
# [[kv_namespaces]]
# binding = "STATS_KV"
# id = "<your-namespace-id>"

# Optional: uncomment to re-run edge probe via `wrangler tail` (see README)
# [triggers]
# crons = ["0 12 * * *"]

# Optional: set after first deploy, e.g. WORKER_URL=https://bedwarsqol-stats.<subdomain>.workers.dev
# Used by: npm run test:worker
